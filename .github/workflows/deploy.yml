name: Deploy naar VPS

on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            # De site draait onder gebruiker smitsite (eigen PM2). Als root deployen
            # faalt op "dubious ownership" in git, dus: rechten goedzetten en als smitsite draaien.
            chown -R smitsite:smitsite /var/www/smit-site
            sudo -u smitsite -H bash -lc 'cd /var/www/smit-site && bash scripts/deploy-vps.sh'
